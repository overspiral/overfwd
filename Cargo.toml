[package]
name = "overfwd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "REST -> IMAP/SMTP bridge (mail forwarding). v0 HTTP scaffold."

[[bin]]
name = "overfwd"
path = "src/main.rs"

[lib]
name = "overfwd"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }

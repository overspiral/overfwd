[package]
name = "overfwd"
version = "0.1.0"
edition = "2021"
description = "A stateless REST facade over remote IMAP/SMTP mailboxes (Mailbox Gateway)."
license = "MIT"
repository = "https://github.com/overspiral/overfwd"

[lib]
name = "overfwd"
path = "src/lib.rs"

[[bin]]
name = "overfwd"
path = "src/main.rs"

[dependencies]
# HTTP server + async runtime (SPEC §4 Gateway).
tokio = { version = "1", features = ["full"] }
axum = "0.8"

# Provider-facing mail stack (SPEC §4). Declared now so downstream IMAP/SMTP/action
# tasks don't have to re-touch Cargo.toml; unused until those tasks land. rustls is
# selected over native-tls to keep the build free of a system OpenSSL dependency.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = [
    "tokio1",
    "tokio1-rustls",
    "ring",          # rustls crypto provider (avoids a system OpenSSL dependency)
    "webpki-roots",  # trust anchors for rustls
    "smtp-transport",
    "builder",
] }
mail-parser = "0.11"
mail-builder = "0.4"

# Support: header decoding, JSON error bodies, structured logging.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

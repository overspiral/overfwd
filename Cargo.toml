[package]
name = "overfwd"
version = "0.1.0"
edition = "2021"
description = "A stateless REST facade over remote IMAP/SMTP mailboxes (Mailbox Gateway)."
license = "MIT"
repository = "https://github.com/overspiral/overfwd"

[lib]
name = "overfwd"
path = "src/lib.rs"

[[bin]]
name = "overfwd"
path = "src/main.rs"

[dependencies]
# HTTP server + async runtime (SPEC §4 Gateway).
tokio = { version = "1", features = ["full"] }
axum = "0.8"

# Provider-facing mail stack (SPEC §4). Declared now so downstream IMAP/SMTP/action
# tasks don't have to re-touch Cargo.toml; unused until those tasks land. rustls is
# selected over native-tls to keep the build free of a system OpenSSL dependency.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = [
    "tokio1",
    "tokio1-rustls",
    "ring",          # rustls crypto provider (avoids a system OpenSSL dependency)
    "webpki-roots",  # trust anchors for rustls
    "smtp-transport",
    "builder",
] }
mail-parser = "0.11"
mail-builder = "0.4"

# TLS for the IMAP client (SPEC §4). async-imap is built `runtime-tokio` with no
# bundled TLS, so the IMAP module supplies its own TLS stream. rustls+ring is
# chosen to match the lettre/webpki-roots stack above and keep the build free of a
# system OpenSSL dependency. `webpki-roots` provides trust anchors for the secure
# path; the insecure path (GreenMail self-signed, MAIL_TLS_INSECURE) uses a custom
# accept-all verifier. `default-features = false` keeps the crypto provider on ring
# (not aws-lc-rs, which would pull a C toolchain).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# Stream combinators for draining async-imap's FETCH result stream.
futures-util = "0.3"
# SHA-256 for the connection pool's opaque, credential-keyed handle (SPEC §4
# pooling): the raw mailbox password is never used as a plaintext map key. `ring`
# is already the pinned crypto provider (rustls+ring above), so declaring it
# directly adds no new crate to the build.
ring = "0.17"

# Support: header decoding, JSON error bodies, structured logging.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
